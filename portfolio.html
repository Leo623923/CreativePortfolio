<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..900;1,300..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     EDIT YOUR CONTENT DOWN IN THE <script> BLOCK AT THE BOTTOM.
     You shouldn't need to touch anything above the script to
     add your own name, art pieces, and tracks.
     ============================================================ */

  :root{
    --ink:#F3ECDD;
    --bg:#141210;
    --bg-2:#1D1916;
    --line: rgba(243,236,221,0.14);
    --accent:#FF4429;
    --accent-2:#E4FF5C;
    --muted:#a49a8a;
    font-family: 'Inter', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }
  ::selection{ background: var(--accent); color: var(--bg); }

  a{ color: inherit; }

  .wrap{ max-width: 1100px; margin: 0 auto; padding: 0 28px; }

  /* ---- Header / Hero ---- */
  header{
    padding: 64px 0 40px;
    border-bottom: 1px solid var(--line);
  }
  .kicker{
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 18px;
    max-width: 46ch;
    line-height: 1.5;
  }
  h1.name{
    font-family: 'Fraunces', serif;
    font-weight: 340;
    font-style: italic;
    font-size: clamp(52px, 11vw, 128px);
    line-height: 0.92;
    margin: 0 0 22px;
    letter-spacing: -0.01em;
  }
  h1.name span{
    display:block;
    font-style: normal;
    font-weight: 680;
    color: var(--accent);
  }
  .roles{
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--ink);
  }
  .roles span{
    border: 1px solid var(--line);
    padding: 6px 14px;
    border-radius: 999px;
  }

  /* ---- Section heads ---- */
  .section{ padding: 72px 0; border-bottom: 1px solid var(--line); }
  .section:last-of-type{ border-bottom: none; }
  .section-head{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .section-head h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(30px, 4.5vw, 46px);
    margin: 0;
  }
  .section-head p{
    color: var(--muted);
    font-size: 14px;
    max-width: 32ch;
    margin: 0;
    line-height: 1.5;
  }

  /* ---- Art gallery ---- */
  .gallery{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  @media (max-width: 720px){ .gallery{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px){ .gallery{ grid-template-columns: 1fr; } }

  .art-card{
    position: relative;
    aspect-ratio: 4 / 5;
    background: var(--bg-2);
    border: 1px solid var(--line);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), border-color 0.35s;
  }
  .gallery .art-card:nth-child(3n+2){ transform: translateY(22px) rotate(-1.2deg); }
  .gallery .art-card:nth-child(3n+3){ transform: translateY(-10px) rotate(1deg); }
  .gallery .art-card:nth-child(3n+1){ transform: rotate(-0.4deg); }
  .art-card:hover{ border-color: var(--accent); }

  .art-card img{
    width:100%; height:100%; object-fit: cover; display:block;
  }
  .art-placeholder{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding: 24px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }
  .art-caption{
    position:absolute; left:0; right:0; bottom:0;
    padding: 12px 14px;
    background: linear-gradient(0deg, rgba(0,0,0,.75), transparent);
    font-size: 13px;
    display:flex; justify-content: space-between; gap: 10px;
  }
  .art-caption .medium{ color: var(--muted); }

  /* ---- Lightbox ---- */
  .lightbox{
    position: fixed; inset:0; background: rgba(10,9,8,0.92);
    display:none; align-items:center; justify-content:center;
    z-index: 50; padding: 40px 20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width: 100%; max-height: 82vh; border: 1px solid var(--line); }
  .lightbox-caption{ position:absolute; bottom: 30px; left:0; right:0; text-align:center; color: var(--muted); font-size: 13px; }
  .lightbox-close{
    position:absolute; top: max(20px, env(safe-area-inset-top)); right: 24px;
    background:none; border: 1px solid var(--line); color: var(--ink);
    width: 40px; height: 40px; border-radius: 50%; cursor:pointer; font-size: 18px;
  }

  /* ---- Music ---- */
  .tracklist{ display:flex; flex-direction: column; }
  .track{
    display:grid;
    grid-template-columns: 32px 1fr auto;
    align-items:center;
    gap: 18px;
    padding: 20px 0;
    border-top: 1px solid var(--line);
  }
  .track:last-child{ border-bottom: 1px solid var(--line); }
  .track-num{ color: var(--muted); font-size: 13px; }
  .track-title{ font-family:'Fraunces', serif; font-size: 20px; font-weight: 480; margin: 0 0 4px; }
  .track-note{ color: var(--muted); font-size: 13px; margin:0; }
  .track audio{
    height: 36px;
    width: min(280px, 45vw);
    filter: invert(1) grayscale(1) contrast(1.1);
  }
  .track-missing{
    color: var(--muted);
    font-size: 13px;
    border: 1px dashed var(--line);
    padding: 8px 14px;
    border-radius: 6px;
  }

  /* ---- About / footer ---- */
  .about-grid{
    display:grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 60px;
  }
  @media (max-width: 720px){ .about-grid{ grid-template-columns: 1fr; } }
  .about-grid p{ font-size: 17px; line-height: 1.65; color: #DCD3C1; max-width: 56ch; }
  .contact-list{ display:flex; flex-direction: column; gap: 10px; font-size: 15px; }
  .contact-list a{ text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; width: fit-content; }
  .contact-list a:hover{ border-color: var(--accent); color: var(--accent); }

  footer{ padding: 30px 0 50px; color: var(--muted); font-size: 13px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }
</style>
</head>
<body>

  <div class="wrap">
    <header>
      <p class="kicker" id="kicker"></p>
      <h1 class="name" id="nameHeading"></h1>
      <div class="roles" id="rolesList"></div>
    </header>

    <section class="section" id="art-section">
      <div class="section-head">
        <h2>Visual work</h2>
        <p>Click a piece to view it larger.</p>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="section" id="music-section">
      <div class="section-head">
        <h2>Music</h2>
        <p>A few recordings, start to finish or in fragments.</p>
      </div>
      <div class="tracklist" id="tracklist"></div>
    </section>

    <section class="section" id="about-section">
      <div class="about-grid">
        <p id="aboutText"></p>
        <div class="contact-list" id="contactList"></div>
      </div>
    </section>

    <footer>
      <span id="footerName"></span>
      <span>built with care</span>
    </footer>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img id="lightboxImg" src="" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

<script>
/* ============================================================
   EDIT EVERYTHING BELOW THIS LINE.

   ART:
     src   -> paste an image URL, or a base64 data URI.
              Leave empty ("") to show a placeholder box —
              handy while you're still deciding what to include.
     title, medium -> shown under the piece.

   MUSIC:
     src   -> a direct audio file URL (.mp3/.wav) if you have
              one hosted somewhere, OR leave empty and use `link`
              to point to SoundCloud / Bandcamp / etc. instead.
     link  -> optional "listen here" URL used when there's no
              direct audio src (or as an extra "hear more" option).
   ============================================================ */

const CONFIG = {
  name: "Your Name",
  kicker: "A one-line intro — what you make, and the thread that connects the art and the music.",
  roles: ["Visual Art", "Music", "Add a third if you like"],

  art: [
    { title: "Untitled I", medium: "Oil on canvas, 2025", src: "" },
    { title: "Untitled II", medium: "Digital, 2025", src: "" },
    { title: "Untitled III", medium: "Ink on paper, 2024", src: "" },
    { title: "Untitled IV", medium: "Mixed media, 2024", src: "" },
    { title: "Untitled V", medium: "Photography, 2023", src: "" },
    { title: "Untitled VI", medium: "Digital, 2023", src: "" }
  ],

  tracks: [
    { title: "Track One", note: "Short description or instrumentation", src: "", link: "" },
    { title: "Track Two", note: "Short description or instrumentation", src: "", link: "" },
    { title: "Track Three", note: "Short description or instrumentation", src: "", link: "" }
  ],

  about: "A short paragraph about you — background, what draws you to both mediums, what you're working on now. Two or three sentences is plenty.",
  contact: [
    { label: "Email", href: "mailto:you@example.com" },
    { label: "Instagram", href: "https://instagram.com/yourhandle" },
    { label: "SoundCloud / Bandcamp", href: "https://soundcloud.com/yourhandle" }
  ]
};

/* ============================================================
   Rendering — no need to edit below here.
   ============================================================ */

document.getElementById('kicker').textContent = CONFIG.kicker;
document.getElementById('footerName').textContent = CONFIG.name;

const nameEl = document.getElementById('nameHeading');
const parts = CONFIG.name.trim().split(' ');
const last = parts.pop();
nameEl.innerHTML = (parts.length ? parts.join(' ') + ' ' : '') + '<span>' + last + '</span>';

const rolesEl = document.getElementById('rolesList');
CONFIG.roles.forEach(r => {
  const s = document.createElement('span');
  s.textContent = r;
  rolesEl.appendChild(s);
});

const gallery = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxCaption = document.getElementById('lightboxCaption');

CONFIG.art.forEach(piece => {
  const card = document.createElement('div');
  card.className = 'art-card';

  if(piece.src){
    const img = document.createElement('img');
    img.src = piece.src;
    img.alt = piece.title;
    card.appendChild(img);
    card.addEventListener('click', () => {
      lightboxImg.src = piece.src;
      lightboxImg.alt = piece.title;
      lightboxCaption.textContent = piece.title + (piece.medium ? ' — ' + piece.medium : '');
      lightbox.classList.add('open');
    });
  } else {
    const ph = document.createElement('div');
    ph.className = 'art-placeholder';
    ph.textContent = 'Add an image src for "' + piece.title + '" in the CONFIG.art list';
    card.appendChild(ph);
  }

  const cap = document.createElement('div');
  cap.className = 'art-caption';
  cap.innerHTML = '<span>' + piece.title + '</span><span class="medium">' + (piece.medium || '') + '</span>';
  card.appendChild(cap);

  gallery.appendChild(card);
});

document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('open'));
lightbox.addEventListener('click', e => { if(e.target === lightbox) lightbox.classList.remove('open'); });

const tracklist = document.getElementById('tracklist');
CONFIG.tracks.forEach((t, i) => {
  const row = document.createElement('div');
  row.className = 'track';

  const num = document.createElement('div');
  num.className = 'track-num';
  num.textContent = String(i + 1).padStart(2, '0');

  const info = document.createElement('div');
  const title = document.createElement('p');
  title.className = 'track-title';
  title.textContent = t.title;
  const note = document.createElement('p');
  note.className = 'track-note';
  note.textContent = t.note || '';
  info.appendChild(title);
  info.appendChild(note);

  let control;
  if(t.src){
    control = document.createElement('audio');
    control.controls = true;
    control.src = t.src;
  } else if(t.link){
    control = document.createElement('a');
    control.href = t.link;
    control.target = '_blank';
    control.rel = 'noopener';
    control.className = 'track-missing';
    control.textContent = 'Listen →';
  } else {
    control = document.createElement('div');
    control.className = 'track-missing';
    control.textContent = 'Add an audio src or link';
  }

  row.appendChild(num);
  row.appendChild(info);
  row.appendChild(control);
  tracklist.appendChild(row);
});

document.getElementById('aboutText').textContent = CONFIG.about;

const contactList = document.getElementById('contactList');
CONFIG.contact.forEach(c => {
  const a = document.createElement('a');
  a.href = c.href;
  a.target = c.href.startsWith('http') ? '_blank' : '_self';
  a.rel = 'noopener';
  a.textContent = c.label;
  contactList.appendChild(a);
});
</script>
</body>
</html>
