<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C090A; --bg2:#160E11; --ink:#F2EADD; --muted:#A8999F;
  --wine:#7C1D2E; --wine-hi:#B23048; --wine-deep:#2B0A12;
  --gold:#CBA75E; --teal:#3BB3AE;
  --line:rgba(242,234,221,.14);
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
::selection{background:var(--wine-hi);color:#fff}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1140px;margin:0 auto;padding:0 28px}

.progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--wine-hi),var(--gold),var(--teal));z-index:40}

/* hero */
.hero{position:relative;overflow:hidden;padding-top:84px;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;width:80vmax;height:80vmax;left:var(--gx,68%);top:var(--gy,25%);transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(124,29,46,.85),rgba(124,29,46,0) 60%);pointer-events:none;transition:left .9s ease-out,top .9s ease-out}
.hero .wrap{position:relative}
.kicker{margin:0 0 20px;color:var(--muted);max-width:44ch;line-height:1.55}
h1.name{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(56px,12vw,148px);line-height:.9;margin:0 0 28px;letter-spacing:-.02em}
h1.name b{display:block;font-style:normal;font-weight:700;color:var(--gold)}
.roles{display:flex;gap:10px;flex-wrap:wrap}
.roles span{border:1px solid var(--teal);color:var(--teal);padding:6px 15px;border-radius:99px;font-size:13px}
.marquee{margin-top:64px;overflow:hidden;background:rgba(43,10,18,.8);border-top:1px solid var(--line)}
.mq{display:flex;width:max-content;animation:mq 45s linear infinite}
.mq span{padding:15px 26px;font-family:var(--serif);font-style:italic;font-size:22px;white-space:nowrap}
.mq span::after{content:"✦";color:var(--gold);margin-left:52px;font-style:normal;font-size:14px}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
.section{padding:84px 0;border-bottom:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:52px}
.head h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,54px);margin:0;line-height:1}
.head h2 i{color:var(--gold)}
.head p{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:38ch;line-height:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);padding:8px 16px;border-radius:99px;font-size:13px;transition:.25s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--wine);border-color:var(--gold);color:#fff}

/* cards */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:60px 34px;align-items:start}
@media(max-width:820px){.gallery{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.gallery{grid-template-columns:1fr}}
.card{opacity:0;transform:translateY(30px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.card.in{opacity:1;transform:none}
.gallery .card:nth-child(3n+2){margin-top:46px}
@media(max-width:820px){.gallery .card:nth-child(n){margin-top:0}}
.frame{perspective:1100px;cursor:zoom-in}
.tilt{position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out;box-shadow:0 22px 50px rgba(0,0,0,.55)}
.tilt::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,236,200,.22),transparent 55%)}
.frame:hover .tilt::after{opacity:1}
.frame:hover .tilt{box-shadow:0 26px 60px rgba(124,29,46,.55)}
.flip-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.card.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);background:var(--bg2)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.back{transform:rotateY(180deg);background:var(--wine-deep)}
.face.back img{object-fit:contain}
.label{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin-top:20px}
.num{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:15px;grid-row:span 3;padding-top:3px}
.ttl{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.2;margin:0}
.meta{font-size:13px;color:var(--muted)}
.meta .kind{color:var(--teal);font-weight:500}
.flipbtn{grid-column:2;justify-self:start;margin-top:10px;background:none;border:1px solid var(--teal);color:var(--teal);padding:7px 15px;border-radius:99px;font-size:13px;transition:.25s}
.flipbtn:hover{background:var(--teal);color:var(--bg)}

/* viewer */
.viewer{position:fixed;inset:0;z-index:60;display:none;grid-template-columns:1fr 340px;background:rgba(10,6,8,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.viewer.open{display:grid;animation:fade .4s}
@keyframes fade{from{opacity:0}}
.stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:zoom-in;touch-action:none;min-height:0}
.stage.z{cursor:grab}.stage.drag{cursor:grabbing}
.stage img{max-width:90%;max-height:88%;user-select:none;-webkit-user-drag:none;box-shadow:0 30px 90px rgba(0,0,0,.7);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s}
.stage.drag img{transition:none}
.stage img.swap{opacity:0}
.info{padding:calc(36px + env(safe-area-inset-top,0px)) 30px 30px;background:linear-gradient(180deg,var(--wine) 0%,var(--wine-deep) 75%);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:16px;overflow:auto}
.count{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:15px}
.info h3{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1;margin:0}
.info .m{font-size:13px;color:#E8CFC9;line-height:1.5}
.info .m .kind{color:#7fe0da;font-weight:500}
.tabs{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.tabs button{flex:1;background:none;border:0;padding:8px 6px;border-radius:99px;font-size:12.5px;transition:.25s}
.tabs button.on{background:var(--gold);color:var(--bg);font-weight:600}
.tools{display:flex;align-items:center;gap:8px;margin-top:auto}
.tools button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:18px;transition:.25s}
.tools button:hover{border-color:var(--gold);color:var(--gold)}
.tools .lvl{font-size:12.5px;color:#E8CFC9;min-width:48px;text-align:center}
.nav{display:flex;gap:10px}
.nav button{flex:1;padding:11px;border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:99px;font-size:13px;transition:.25s}
.nav button:hover{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.hint{font-size:11.5px;color:#C9A9A6;line-height:1.5;margin:0}
.x{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:22px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.4);font-size:20px;transition:.25s}
.x:hover{border-color:var(--gold);color:var(--gold);transform:rotate(90deg)}
@media(max-width:800px){.viewer{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.info{padding:18px 20px 22px;gap:11px;max-height:46vh;border-left:0;border-top:1px solid var(--line)}.info h3{font-size:24px}.hint{display:none}.tools{margin-top:0}}

/* about */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:60px}
@media(max-width:720px){.about{grid-template-columns:1fr;gap:30px}}
.about p{font-size:18px;line-height:1.65;color:#DDD2C4;max-width:56ch;margin:0}
.contact{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.contact a{color:var(--ink);text-decoration:none;font-family:var(--serif);font-size:22px;border-bottom:1px solid var(--wine-hi);padding-bottom:2px;transition:.25s}
.contact a:hover{color:var(--gold);border-color:var(--gold)}
footer{padding:30px 0 56px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<header class="hero" id="hero">
  <div class="wrap">
    <p class="kicker" id="kicker"></p>
    <h1 class="name" id="nameH"></h1>
    <div class="roles" id="roles"></div>
  </div>
  <div class="marquee"><div class="mq" id="mq"></div></div>
</header>

<div class="wrap">
  <section class="section" id="work">
    <div class="head">
      <div><h2>Selected <i>work</i></h2><p>Tap any piece to open it — scroll or click inside to zoom, drag to explore the detail.</p></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="section" style="border-bottom:0">
    <div class="about"><p id="aboutT"></p><div class="contact" id="contact"></div></div>
  </section>
  <footer><span id="footName"></span><span>built with care</span></footer>
</div>

<div class="viewer" id="viewer" aria-modal="true" role="dialog">
  <button class="x" id="vx" aria-label="Close">&times;</button>
  <div class="stage" id="stage"><img id="vimg" alt=""></div>
  <aside class="info">
    <span class="count" id="vcount"></span>
    <h3 id="vtitle"></h3>
    <div class="m" id="vmeta"></div>
    <div class="m" id="vnote"></div>
    <div class="tabs" id="vtabs" style="display:none"></div>
    <div class="tools"><button id="zo" aria-label="Zoom out">−</button><span class="lvl" id="lvl">100%</span><button id="zi" aria-label="Zoom in">+</button><button id="zr" aria-label="Reset" title="Reset">⟲</button></div>
    <div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div>
    <p class="hint">Scroll or click to zoom · drag to pan · ← → to browse · Esc to close</p>
  </aside>
</div>

<script>
/* ============================================================
   EDIT YOUR CONTENT HERE.
   Each piece: title, kind (used for the filter buttons), medium
   and year (both optional — leave "" to hide), note (optional
   one-liner), src (an IMG.xxx entry or an image URL), ratio.
   A piece with `back:` gets a flip button + a tab in the viewer.
   ============================================================ */
const CONFIG = {
  name: "Leo Barassi",
  kicker: "Coping my way through my degree with creativity.",
  roles: ["Physics/Astrophysics Major", "Guitar Playing and Vocalist", "Painting for the Love of the Game", "Expert in Pirating Graphics Design Software"],
  art: [
    { title: "Sins of Virtuous Minds Cover Version 1", kind: "Album artwork", medium: "GIMP Digital Software/Photography", year: "2021", note: "", src: "images/album-cover-v1.jpeg", ratio: 1.0 },
    { title: "Sins of Virtuous Minds Cover Version 2", kind: "Album artwork", medium: "GIMP Digital Software/Photography", year: "2021", note: "", src: "images/album-cover-v2.jpeg", ratio: 1.0 },
    { title: "LSD", kind: "Painting", medium: "Acrylic and Oil Pastels", year: "2023", note: "", src: "images/LSD.jpeg", ratio: 0.753 },
    { title: "marys-doors-of-perception.jpg", kind: "Painting", medium: "Mixed Media", year: "2025",
      note: "Reworked from a Baroque painting of the Presentation of the Virgin (flip it to see the reference.)",
      src: "images/Mary's Doors of Perception.jpg", ratio: 0.9967,
      back: { title: "Presentation of the Virgin", credit: "Callieri · the reference painting", src: "images/presentation-of-the-virgin-reference.jpg" } },
    { title: "Bass drum skin Piece", kind: "Drum skin", medium: "Acrylic painted drum skin", year: "2023", note: "", src: "images/Drumskin.jpeg", ratio: 1.0175 }
  ],
  about: "A short paragraph about you — background, what draws you to your work, what you're working on now. Two or three sentences is plenty.",
  contact: [
    { label: "Email", href: "mailto:Barassileo@gmail.com" },
    { label: "Instagram", href: "https://instagram.com/leo_barassi" },
    { label: "TikTok", href: "https://www.tiktok.com/@user483910leobarassihehe" }
  ]
};

/* ---------- rendering (no need to edit below) ---------- */
const $ = id => document.getElementById(id), pad = n => String(n).padStart(2, '0'), A = CONFIG.art;
$('kicker').textContent = CONFIG.kicker; $('footName').textContent = CONFIG.name; $('aboutT').textContent = CONFIG.about;
const parts = CONFIG.name.trim().split(' '), last = parts.pop();
$('nameH').innerHTML = (parts.length ? parts.join(' ') + ' ' : '') + '<b>' + last + '</b>';
CONFIG.roles.forEach(r => { const s = document.createElement('span'); s.textContent = r; $('roles').appendChild(s); });
CONFIG.contact.forEach(c => { const a = document.createElement('a'); a.href = c.href; a.textContent = c.label; if (c.href.startsWith('http')) { a.target = '_blank'; a.rel = 'noopener'; } $('contact').appendChild(a); });

// marquee
const words = A.map(p => p.title).concat(CONFIG.roles);
$('mq').innerHTML = [...words, ...words, ...words, ...words].map(w => '<span>' + w + '</span>').join('');

// hero glow follows the pointer
$('hero').addEventListener('pointermove', e => { const r = $('hero').getBoundingClientRect(); $('hero').style.setProperty('--gx', ((e.clientX - r.left) / r.width * 100) + '%'); $('hero').style.setProperty('--gy', ((e.clientY - r.top) / r.height * 100) + '%'); });
addEventListener('scroll', () => { const h = document.documentElement; $('progress').style.transform = 'scaleX(' + (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)) + ')'; }, { passive: true });

// cards
const cards = [], io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 }) : null;
A.forEach((p, i) => {
  const c = document.createElement('article'); c.className = 'card'; c.dataset.kind = p.kind;
  const face = (s, t, cls) => '<div class="face ' + (cls || '') + '"><img src="' + s + '" alt="' + t + '"></div>';
  const meta = [p.medium, p.year].filter(Boolean).join(' · ');
  c.innerHTML = '<div class="frame"><div class="tilt" style="aspect-ratio:' + p.ratio + '">' +
    (p.back ? '<div class="flip-inner">' + face(p.src, p.title) + face(p.back.src, p.back.title, 'back') + '</div>' : face(p.src, p.title)) +
    '</div></div><div class="label"><span class="num">' + pad(i + 1) + '</span><h3 class="ttl">' + p.title + '</h3>' +
    '<div class="meta"><span class="kind">' + p.kind + '</span>' + (meta ? ' · ' + meta : '') + '</div>' +
    (p.back ? '<button class="flipbtn">↻ See the reference painting</button>' : '') + '</div>';
  const t = c.querySelector('.tilt');
  c.querySelector('.frame').addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height; t.style.setProperty('--ry', ((x - .5) * 9) + 'deg'); t.style.setProperty('--rx', ((.5 - y) * 9) + 'deg'); t.style.setProperty('--mx', x * 100 + '%'); t.style.setProperty('--my', y * 100 + '%'); });
  c.querySelector('.frame').addEventListener('pointerleave', () => { t.style.setProperty('--rx', '0deg'); t.style.setProperty('--ry', '0deg'); });
  c.querySelector('.frame').addEventListener('click', () => openV(i, c.classList.contains('flipped') ? 1 : 0));
  const fb = c.querySelector('.flipbtn');
  if (fb) fb.addEventListener('click', () => { const f = c.classList.toggle('flipped'); fb.textContent = f ? '↻ Back to my painting' : '↻ See the reference painting'; });
  $('gallery').appendChild(c); cards.push(c); io ? io.observe(c) : c.classList.add('in');
});

// filters
const kinds = ['All', ...new Set(A.map(p => p.kind))];
kinds.forEach((k, n) => { const b = document.createElement('button'); b.className = 'chip' + (n ? '' : ' on'); b.textContent = k;
  b.onclick = () => { document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); b.classList.add('on');
    cards.forEach(c => { const show = k === 'All' || c.dataset.kind === k; c.style.display = show ? '' : 'none'; if (show) { c.classList.remove('in'); requestAnimationFrame(() => requestAnimationFrame(() => c.classList.add('in'))); } }); };
  $('chips').appendChild(b); });

// viewer
let cur = 0, side = 0, s = 1, tx = 0, ty = 0;
const st = $('stage'), vi = $('vimg');
function apply() { vi.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')'; st.classList.toggle('z', s > 1); $('lvl').textContent = Math.round(s * 100) + '%'; }
function clamp() { const mx = Math.max(0, (vi.clientWidth * s - st.clientWidth) / 2 + 60), my = Math.max(0, (vi.clientHeight * s - st.clientHeight) / 2 + 60); tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty)); }
function zoomAt(ns, cx, cy) { ns = Math.max(1, Math.min(5, ns)); const r = st.getBoundingClientRect(), px = cx - r.left - r.width / 2, py = cy - r.top - r.height / 2; tx = px - (px - tx) * (ns / s); ty = py - (py - ty) * (ns / s); s = ns; if (s === 1) { tx = 0; ty = 0; } clamp(); apply(); }
function show(swap) {
  const p = A[cur], b = side === 1 && p.back, d = b ? p.back : p;
  const go = () => { vi.src = d.src; vi.alt = d.title; s = 1; tx = ty = 0; apply(); vi.classList.remove('swap'); };
  swap ? (vi.classList.add('swap'), setTimeout(go, 220)) : go();
  $('vcount').textContent = pad(cur + 1) + ' / ' + pad(A.length);
  $('vtitle').textContent = d.title;
  const meta = b ? d.credit : [p.medium, p.year].filter(Boolean).join(' · ');
  $('vmeta').innerHTML = '<span class="kind">' + (b ? 'Reference' : p.kind) + '</span>' + (meta ? ' · ' + meta : '');
  $('vnote').textContent = b ? '' : (p.note || '');
  const tb = $('vtabs'); tb.style.display = p.back ? 'flex' : 'none';
  if (p.back) { tb.innerHTML = '<button class="' + (side ? '' : 'on') + '">My painting</button><button class="' + (side ? 'on' : '') + '">Reference</button>'; tb.children[0].onclick = () => { side = 0; show(true); }; tb.children[1].onclick = () => { side = 1; show(true); }; }
}
function openV(i, sd) { cur = i; side = sd || 0; $('viewer').classList.add('open'); document.body.style.overflow = 'hidden'; show(false); }
function closeV() { $('viewer').classList.remove('open'); document.body.style.overflow = ''; }
const step = d => { cur = (cur + d + A.length) % A.length; side = 0; show(true); };
$('vx').onclick = closeV; $('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
$('zi').onclick = () => { const r = st.getBoundingClientRect(); zoomAt(s * 1.5, r.left + r.width / 2, r.top + r.height / 2); };
$('zo').onclick = () => { const r = st.getBoundingClientRect(); zoomAt(s / 1.5, r.left + r.width / 2, r.top + r.height / 2); };
$('zr').onclick = () => { s = 1; tx = ty = 0; apply(); };
addEventListener('keydown', e => { if (!$('viewer').classList.contains('open')) return; if (e.key === 'Escape') closeV(); if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
st.addEventListener('wheel', e => { e.preventDefault(); zoomAt(s * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY); }, { passive: false });
let dn = null, moved = 0;
st.addEventListener('pointerdown', e => { dn = { x: e.clientX, y: e.clientY, tx, ty }; moved = 0; st.setPointerCapture(e.pointerId); });
st.addEventListener('pointermove', e => { if (!dn) return; const dx = e.clientX - dn.x, dy = e.clientY - dn.y; moved = Math.max(moved, Math.hypot(dx, dy)); if (s > 1 && moved > 4) { st.classList.add('drag'); tx = dn.tx + dx; ty = dn.ty + dy; clamp(); apply(); } });
st.addEventListener('pointerup', e => { st.classList.remove('drag'); if (dn && moved < 5) { e.target === vi ? (s > 1 ? zoomAt(1, e.clientX, e.clientY) : zoomAt(2.6, e.clientX, e.clientY)) : closeV(); } dn = null; });
</script>
</body>
</html>
